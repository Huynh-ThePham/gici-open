# GICI ROS 2 UrbanNav configuration.
#
# Ported verbatim from the original author's ros_wrapper/src/gici/option/ros_urbannav.yaml
# (chichengcn/gici-open @ f2b8579). The ONLY changes vs upstream are the output file
# paths and the log directory, which now point inside this research workspace so that
# nothing is written outside the repo. Estimator options are byte-for-byte identical.
#
# Data path: play a ROS 2 bag that contains the GICI GNSS topics (and, when the IMU/camera
# blocks below are enabled, /imu/data + /zed2/camera/left/image_raw). See
# scripts/ros2/README and scripts/ros2/urbannav_make_ros2_bag.sh.
stream:
  streamers:
  - streamer:
      tag: str_ros_gnss_rov
      type: ros
      topic_name: /gici/gnss_rover
      io: input
      format: gnss_raw
      enable_observation: true
  - streamer:
      tag: str_ros_gnss_ref
      type: ros
      topic_name: /gici/gnss_reference
      io: input
      format: gnss_raw
      enable_observation: true
      enable_antenna_position: true
  - streamer:
      tag: str_ros_gnss_eph_G
      type: ros
      topic_name: /gici/gps_ephemeris
      io: input
      format: gnss_raw
      enable_ephemeris: true
      enable_ionosphere_parameter: true
      queue_size: 10
  - streamer:
      tag: str_ros_gnss_eph_R
      type: ros
      topic_name: /gici/glonass_ephemeris
      io: input
      format: gnss_raw
      enable_ephemeris: true
      queue_size: 10
  - streamer:
      tag: str_ros_gnss_eph_E
      type: ros
      topic_name: /gici/galileo_ephemeris
      io: input
      format: gnss_raw
      enable_ephemeris: true
      queue_size: 10
  - streamer:
      tag: str_ros_gnss_eph_C
      type: ros
      topic_name: /gici/bds_ephemeris
      io: input
      format: gnss_raw
      enable_ephemeris: true
      queue_size: 10
  # - streamer:
  #     tag: str_ros_imu
  #     type: ros
  #     topic_name: /imu/data
  #     queue_size: 10
  #     io: input
  #     format: imu
  # - streamer:
  #     tag: str_ros_camera
  #     type: ros
  #     topic_name: /zed2/camera/left/image_raw
  #     queue_size: 10
  #     io: input
  #     format: image
  - streamer:
      tag: str_solution_file
      input_tags: [fmt_solution_file]
      type: file
      path: OUTPUT_DIR/solution.txt
      enable_time_tag: false
  - streamer:
      tag: str_solution_file_2
      input_tags: [fmt_solution_file_2]
      type: file
      path: OUTPUT_DIR/solution_2.txt
      enable_time_tag: false
  # - streamer:
  #     tag: str_solution
  #     type: ros
  #     topic_name: solution
  #     queue_size: 5
  #     io: output
  #     format: pose_stamped
  # - streamer:
  #     tag: str_solution_odometry
  #     type: ros
  #     topic_name: solution_odometry
  #     queue_size: 10
  #     io: output
  #     format: odometry
  #     subframe_id: Body
  # - streamer:
  #     tag: str_solution_path
  #     type: ros
  #     topic_name: solution_path
  #     queue_size: 100
  #     io: output
  #     format: path
  # - streamer:
  #     tag: str_featured_image
  #     type: ros
  #     topic_name: featured_image
  #     queue_size: 3
  #     io: output
  #     format: image
  # - streamer:
  #     tag: str_landmarks
  #     type: ros
  #     topic_name: landmarks
  #     queue_size: 3
  #     marker_scale: 0.3
  #     io: output
  #     format: marker

  formators:
  - formator:
      io: output
      tag: fmt_solution_file
      type: nmea 
      use_esa: true
      use_esd: true
      talker_id: GP
  - formator:
      io: output
      tag: fmt_solution_file_2
      type: nmea 
      use_esa: true
      use_esd: true
      talker_id: GP

  replay:
    enable: false

estimate:
- estimator:
    tag: est_gnss
    type: rtk
    input_tags: [str_ros_gnss_rov, str_ros_gnss_ref, str_ros_gnss_eph_G, str_ros_gnss_eph_R, str_ros_gnss_eph_E, str_ros_gnss_eph_C]
    str_ros_gnss_rov_roles: [rover]
    str_ros_gnss_ref_roles: [reference]
    str_ros_gnss_eph_G_roles: [ephemeris, ion_utc]
    str_ros_gnss_eph_R_roles: [ephemeris]
    str_ros_gnss_eph_E_roles: [ephemeris]
    str_ros_gnss_eph_C_roles: [ephemeris]
    output_tags: [fmt_solution_file_2]
    output_align_tag: str_ros_gnss_rov
    compute_covariance: true
    rtk_options:
      max_window_length: 3
      use_ambiguity_resolution: true
      estimate_velocity: true
    gnss_estimator_base_options:
      min_num_satellite_redundancy: 2
      use_outlier_rejection: true
      max_pesudorange_error: 30.0
      max_phaserange_error: 0.1
      max_doppler_error: 5.0
      gnss_error_parameter:
        code_to_phase_ratio: 1000.0
        doppler_error_factor: 0.2
        relative_velocity: [10.0, 10.0, 1.0]
        relative_frequency: 1.0
      gnss_common:
        min_elevation: 7.0
        min_SNR: [30.0, 25.0]
    estimator_base_options:
      max_iteration: 5
      num_threads: 2
      max_solver_time: 0.02
      verbose_output: true
      solver_type: dense_schur
      trust_region_strategy_type: dogleg
    ambiguity_resolution_options:
      system_exclude: [R]
      min_percentage_fixation_uwl: 1.0
      min_percentage_fixation_wl: 0.9
      min_percentage_fixation_nl: 0.9
      ratio: 2.0

logging:
  enable: true
  min_log_level: 0
  log_to_stderr: true
  file_directory: OUTPUT_DIR/log

# For the full RTK/IMU/Camera (RRR) pipeline that reproduces the paper's Deep/Medium
# numbers, enable the str_ros_imu + str_ros_camera streamers above and use the
# est_gnss_imu_camera_rrr estimator block from the upstream template
# (ros_wrapper/src/gici/option/ros_urbannav.yaml lines 395-518). Keep the option
# values identical to upstream; only add the estimator to the "estimate:" list.
#
# rosbag play: ros2 bag play <bag> --topics /gici/gnss_rover /gici/gnss_reference \
#   /gici/gps_ephemeris /gici/glonass_ephemeris /gici/galileo_ephemeris /gici/bds_ephemeris
