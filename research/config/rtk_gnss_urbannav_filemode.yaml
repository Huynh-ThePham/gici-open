# UrbanNav GNSS-only RTK, post-processing FILE mode (author's actual run method).
#
# This is the file-mode counterpart of ros2_wrapper/.../config/ros_urbannav.yaml:
# the `estimate:` block below is byte-for-byte identical to the ROS 2 est_gnss
# estimator, but the input comes from RINEX files (type: post-file) instead of ROS
# topics. Post-file mode loads the whole session, so the run should produce the FULL
# trajectory cleanly. Treat crash and timeout exits as failures; do not lock partial
# solution files.
#
# Placeholders (<...>) are substituted by scripts/run_urbannav_rtk_filemode.sh.
stream:
  streamers:
  - streamer:
      tag: str_gnss_rov_file
      type: post-file
      path: <ROVER_OBS>
      format:
        type: gnss-rinex
      latency: 0.0
  - streamer:
      tag: str_gnss_ref_file
      type: post-file
      path: <REF_OBS>
      format:
        type: gnss-rinex
  - streamer:
      tag: str_gnss_eph_file
      type: post-file
      path: <EPH_NAV>
      burst_load: true
      format:
        type: gnss-rinex
  - streamer:
      tag: str_dcb_file
      type: post-file
      path: <DCB_FILE>
      burst_load: true
      format:
        type: dcb-file
  - streamer:
      tag: str_solution_file
      input_tags: [fmt_solution_file]
      type: file
      path: <OUTPUT_DIR>/solution.txt
      enable_time_tag: false

  formators:
  - formator:
      io: output
      tag: fmt_solution_file
      type: nmea
      use_esa: true
      use_esd: true
      talker_id: GP

  replay:
    enable: false
    start_offset: 0.0

estimate:
- estimator:
    tag: est_gnss
    type: rtk
    input_tags: [str_gnss_rov_file, str_gnss_ref_file, str_gnss_eph_file, str_dcb_file]
    str_gnss_rov_file_roles: [rover]
    str_gnss_ref_file_roles: [reference]
    str_gnss_eph_file_roles: [ephemeris, ion_utc]
    str_dcb_file_roles: [code_bias]
    output_tags: [fmt_solution_file]
    output_align_tag: str_gnss_rov_file
    compute_covariance: true
    rtk_options:
      max_window_length: 3
      use_ambiguity_resolution: true
      estimate_velocity: true
    gnss_estimator_base_options:
      min_num_satellite_redundancy: 2
      use_outlier_rejection: true
      max_pesudorange_error: 30.0
      max_phaserange_error: 0.1
      max_doppler_error: 5.0
      gnss_error_parameter:
        code_to_phase_ratio: 1000.0
        doppler_error_factor: 0.2
        relative_velocity: [10.0, 10.0, 1.0]
        relative_frequency: 1.0
      gnss_common:
        min_elevation: 7.0
        min_SNR: [30.0, 25.0]
    estimator_base_options:
      max_iteration: 5
      num_threads: 2
      max_solver_time: 0.02
      verbose_output: true
      solver_type: dense_schur
      trust_region_strategy_type: dogleg
    ambiguity_resolution_options:
      system_exclude: [R]
      min_percentage_fixation_uwl: 1.0
      min_percentage_fixation_wl: 0.9
      min_percentage_fixation_nl: 0.9
      ratio: 2.0

logging:
  enable: true
  min_log_level: 0
  log_to_stderr: true
  file_directory: <OUTPUT_DIR>/log
