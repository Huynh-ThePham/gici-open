# Research RTK/IMU/Camera RRR-VA on GICI dataset 1.1 (open-sky).
#
# Faithful clone of research/config/rtk_imu_camera_rrr_1_1.yaml (the locked baseline
# config). The ONLY differences are (a) estimator type rtk_imu_camera_rrr_va, and (b) the
# vision-aided AR options + the benchmark flag. Every tuning parameter is byte-identical to
# the baseline, so a VA-vs-baseline comparison on 1.1 isolates the AR covariance path alone.
#
# Purpose: runnable equivalence + cost experiment. benchmark_joint_ambiguity_covariance
# logs, per AR epoch, the fast marginal covariance vs the whole-problem ceres::Covariance
# reference (rel_err) and both timings -- the runtime validation that the fast routine is
# numerically the same consistent covariance, on real graphs. GICI-board is open-sky where
# AR already works, so this proves real-time + equivalence + no-regression, NOT an accuracy
# win over SOTA (that needs UrbanNav; see research/VISION_AIDED_AR.md).
#
# Placeholders expanded by scripts/run_va_1_1.sh (same substitution as run_baseline_1_1.sh).

stream:
  streamers:
  - streamer:
      tag: str_gnss_rov_file
      type: post-file
      path: <DATASET_1_1>/gnss_rover.bin
      format:
        type: gnss-raw
        sub_type: tersus
      latency: 0.0
  - streamer:
      tag: str_gnss_ref_file
      type: post-file
      path: <DATASET_1_1>/gnss_reference.bin
      format:
        type: gnss-rtcm-3
        start_time: 2023.03.20
  - streamer:
      tag: str_gnss_eph_file
      type: post-file
      path: <DATASET_1_1>/gnss_ephemeris.bin
      burst_load: true
      format:
        type: gnss-rtcm-3
        start_time: 2023.03.20
  - streamer:
      tag: str_dcb_file
      type: post-file
      path: <GICI_ROOT>/option/CAS0MGXRAP_20221580000_01D_01D_DCB.BSX
      burst_load: true
      format:
        type: dcb-file
  - streamer:
      tag: str_imu_file
      type: post-file
      path: <DATASET_1_1>/imu.bin
      format:
        type: imu-pack
  - streamer:
      tag: str_camera_file
      type: post-file
      path: <DATASET_1_1>/camera.bin
      buffer_length: 361472
      format:
        type: image-pack
        width: 752
        height: 480
  - streamer:
      tag: str_rrr_solution_file
      input_tags: [fmt_rrr_solution_file]
      type: file
      path: <OUTPUT_DIR>/solution.txt
      enable_time_tag: false

  formators:
  - formator:
      io: output
      tag: fmt_rrr_solution_file
      type: nmea
      use_esa: true
      use_esd: true
      talker_id: GP

  replay:
    enable: true
    start_offset: 0.0
    speed: 1.0

estimate:
- estimator:
    tag: est_gnss_imu_camera_rrr
    type: rtk_imu_camera_rrr_va
    input_tags: [str_gnss_rov_file, str_gnss_ref_file, str_gnss_eph_file, str_dcb_file, str_imu_file, str_camera_file]
    str_gnss_rov_file_roles: [rover]
    str_gnss_ref_file_roles: [reference]
    str_gnss_eph_file_roles: [ephemeris]
    str_dcb_file_roles: [code_bias]
    str_imu_file_roles: [major]
    str_camera_file_roles: [mono]
    output_tags: [fmt_rrr_solution_file]
    output_align_tag: str_imu_file
    output_downsample_rate: 40
    compute_covariance: false
    enable_input_align: true
    input_align_latency: 1.0
    rtk_imu_camera_rrr_options:
      max_keyframes: 3
      min_yaw_std_init_visual: 0.5
      # Vision-aided AR: fast exact-in-window marginal covariance (the intended VA path).
      use_vision_aided_ambiguity_resolution: true
      ar_use_fast_marginal_covariance: true
      ar_use_exact_joint_covariance: false
      ar_use_delta_information: false
      # Log per-AR-epoch equivalence (fast vs ceres::Covariance) + timings.
      benchmark_joint_ambiguity_covariance: true
    rtk_options:
      use_ambiguity_resolution: true
    gnss_estimator_base_options:
      use_outlier_rejection: true
      reject_one_outlier_once: false
      max_pesudorange_error: 4.0
      max_phaserange_error: 0.06
      max_doppler_error: 0.5
      gnss_common:
        min_elevation: 12.0
        min_SNR: [35.0, 30.0]
    visual_estimator_base_options:
      feature_error_std: 10.0
      stable_feature_error_std: 1.0
      min_observation_stable: 20
      landmark_outlier_rejection_threshold: 2.0
    imu_estimator_base_options:
      imu_parameters:
        sigma_bg: 1.0e-3
        sigma_ba: 1.0e-2
        sigma_g_c: 2.6700e-04
        sigma_a_c: 0.0112
        sigma_gw_c: 2.0881e-06
        sigma_aw_c: 2.7361e-04
      body_to_imu_rotation: [-90.0, -90.0, 0.0]
      body_to_imu_rotation_std: 5.0
      car_motion: true
      car_motion_min_velocity: 3.0
      car_motion_max_anguler_velocity: 5.0
    estimator_base_options:
      max_iteration: 5
      num_threads: 4
      max_solver_time: 0.03
      verbose_output: false
      solver_type: dense_schur
      trust_region_strategy_type: dogleg
    ambiguity_resolution_options:
      system_exclude: [R]
      min_percentage_fixation_uwl: 1.0
      min_percentage_fixation_wl: 0.9
      min_percentage_fixation_nl: 0.9
      ratio: 2.0
      use_success_rate_fix_information: true
    gnss_imu_initializer_options:
      max_iteration: 30
      num_threads: 4
      max_solver_time: 0.5
      gnss_extrinsics: [-0.035, 0.354, -0.042]
      gnss_extrinsics_initial_std: [0.0, 0.0, 0.0]
      time_window_length_slow_motion: 0.05
      time_window_length_dynamic_motion: 0.5
      min_acceleration: 0.5
    feature_handler_options:
      max_features_per_frame: 100
      max_n_kfs: 30
      kfselect_min_numkfs: 30
      kfselect_min_disparity: 10.0
      kfselect_min_dist_metric: 0.5
      kfselect_min_angle: 5.0
      kfselect_min_dt: 1.0
      detector:
        cell_size: 40
      camera_parameters:
        label: "gici-board"
        cameras:
        - camera:
            label: cam0
            image_width: 752
            image_height: 480
            type: pinhole
            intrinsics:
              cols: 1
              rows: 4
              data: [510.12091726559544, 509.55338413343736, 357.48596105253193, 240.00309579253124]
            distortion:
              type: radial-tangential
              parameters:
                cols: 1
                rows: 4
                data: [-0.36472323465957157, 0.11530151924890532, 0.0006024586154990503, 0.0020184970860498133]
            mask: <GICI_ROOT>/option/gici-mask.png
          T_B_C:
            cols: 4
            rows: 4
            data: [0.0134381210697455122,   -0.999901594987671172, -0.00402706384669154413,  -0.0229793554058591656,
                  0.999907681540912807,   0.0134460859659659704, -0.00195733688253543802,   0.0110786309679912626,
                  0.00201129251744842832, -0.00400038914436078377,     0.99998997574430859,    0.025008868367930974,
                                      0,                       0,                       0,                       1]

# Enable stderr INFO logging so the [vaar-fast] equivalence/cost lines are captured.
logging:
  enable: true
  log_to_stderr: true
  min_log_level: 0
