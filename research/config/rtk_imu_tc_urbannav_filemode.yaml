# UrbanNav RTK/IMU tightly-coupled (no camera), post-file mode.
# Stream: post_estimation_RTK_RRR_rinex_imutext.yaml (GNSS + IMU only)
# Estimator: ros_urbannav.yaml RTK/IMU TC block @ f2b8579

stream:
  streamers:
  - streamer:
      tag: str_gnss_rov_file
      type: post-file
      path: <ROVER_OBS>
      format:
        type: gnss-rinex
      latency: 0.0
  - streamer:
      tag: str_gnss_ref_file
      type: post-file
      path: <REF_OBS>
      format:
        type: gnss-rinex
      latency: 0.0
  - streamer:
      tag: str_gnss_eph_file
      type: post-file
      path: <EPH_NAV>
      burst_load: true
      format:
        type: gnss-rinex
  - streamer:
      tag: str_dcb_file
      type: post-file
      path: <DCB_FILE>
      burst_load: true
      format:
        type: dcb-file
  - streamer:
      tag: str_imu_file
      type: post-file
      path: <IMU_FILE>
      format:
        type: imu-text
  - streamer:
      tag: str_solution_file
      input_tags: [fmt_solution_file]
      type: file
      path: <OUTPUT_DIR>/solution.txt
      enable_time_tag: false

  formators:
  - formator:
      io: output
      tag: fmt_solution_file
      type: nmea
      use_esa: true
      use_esd: true
      talker_id: GP

  replay:
    enable: true
    speed: 1.0
    start_offset: 0.0

estimate:
- estimator:
    tag: est_rtk_imu_tc
    type: rtk_imu_tc
    input_tags: [str_gnss_rov_file, str_gnss_ref_file, str_gnss_eph_file, str_dcb_file, str_imu_file]
    str_gnss_rov_file_roles: [rover]
    str_gnss_ref_file_roles: [reference]
    str_gnss_eph_file_roles: [ephemeris, ion_utc]
    str_dcb_file_roles: [code_bias]
    str_imu_file_roles: [major]
    output_tags: [fmt_solution_file]
    output_align_tag: str_gnss_rov_file
    output_downsample_rate: 1
    compute_covariance: false
    enable_input_align: false
    input_align_latency: 0.2
    rtk_imu_tc_options:
      max_window_length: 10
    rtk_options:
      max_window_length: 3
      use_ambiguity_resolution: true
      estimate_velocity: true
    gnss_estimator_base_options:
      min_num_satellite_redundancy: 2
      use_outlier_rejection: true
      max_pesudorange_error: 30.0
      max_phaserange_error: 0.1
      max_doppler_error: 5.0
      gnss_error_parameter:
        code_to_phase_ratio: 1000.0
        doppler_error_factor: 0.2
        relative_frequency: 1.0
      gnss_common:
        min_elevation: 7.0
        min_SNR: [30.0, 25.0]
    imu_estimator_base_options:
      imu_parameters:
        sigma_bg: 0.001
        sigma_ba: 0.01
        sigma_g_c: 0.010270904839480961
        sigma_a_c: 0.011197412605492375
        sigma_gw_c: 9.13553839948819e-05
        sigma_aw_c: 0.00011751767903346351
      body_to_imu_rotation: [0.0, 0.0, 0.0]
      body_to_imu_rotation_std: 5.0
      car_motion: true
      car_motion_min_velocity: 3.0
      car_motion_max_anguler_velocity: 5.0
      zupt_max_acc_std: 0.45
      zupt_max_gyro_std: 0.05
      zupt_max_gyro_median: 0.01
      zupt_sigma_zero_velocity: 0.01
    estimator_base_options:
      max_iteration: 5
      num_threads: 4
      max_solver_time: 0.05
      verbose_output: false
      solver_type: dense_schur
      trust_region_strategy_type: dogleg
    ambiguity_resolution_options:
      system_exclude: [R]
      min_percentage_fixation_uwl: 1.0
      min_percentage_fixation_wl: 0.9
      min_percentage_fixation_nl: 0.9
      ratio: 3.0
    gnss_imu_initializer_options:
      max_iteration: 30
      num_threads: 4
      max_solver_time: 0.5
      gnss_extrinsics: [0.0, -0.43, -0.16]
      gnss_extrinsics_initial_std: [0.0, 0.0, 0.0]
      time_window_length_slow_motion: 0.1
      time_window_length_dynamic_motion: 3.0
      min_acceleration: 0.5

logging:
  enable: false
