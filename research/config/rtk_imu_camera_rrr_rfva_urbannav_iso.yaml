# Research UrbanNav offline RTK/IMU/Camera RRR RF-VA (bounded-influence GNSS loss + VA-v4).
#
# ONLY difference from rtk_imu_camera_rrr_va4_urbannav.yaml: the
# use_bounded_influence_gnss_loss flag below (research/PREREG_ROBUST_FLOAT.md).
#
# ONLY difference from rtk_imu_camera_rrr_va_urbannav.yaml (VA-v2): the
# use_success_rate_fix_information flag below (research/PREREG_SOFT_WEIGHT.md).
#
# This is NOT a baseline template. It is intentionally separate from
# rtk_imu_camera_rrr_urbannav.yaml so research runs cannot overwrite or masquerade as
# locked baseline runs. Use scripts/run_urbannav_rrr_va.py and write outputs under
# results/research/urbannav_va by default.
#
# Stream layout: option/post_estimation_RTK_RRR_rinex_imutext.yaml @ f2b8579
# Estimator calib: ros_wrapper/src/gici/option/ros_urbannav.yaml (RRR block) @ f2b8579
# Paths filled by scripts/run_urbannav_rrr_va.py

stream:
  streamers:
  - streamer:
      tag: str_gnss_rov_file
      type: post-file
      path: <ROVER_OBS>
      format:
        type: gnss-rinex
      latency: 0.0
  - streamer:
      tag: str_gnss_ref_file
      type: post-file
      path: <REF_OBS>
      format:
        type: gnss-rinex
      latency: 0.0
  - streamer:
      tag: str_gnss_eph_file
      type: post-file
      path: <EPH_NAV>
      burst_load: true
      format:
        type: gnss-rinex
  - streamer:
      tag: str_dcb_file
      type: post-file
      path: <DCB_FILE>
      burst_load: true
      format:
        type: dcb-file
  - streamer:
      tag: str_imu_file
      type: post-file
      path: <IMU_FILE>
      format:
        type: imu-text
  - streamer:
      tag: str_camera_file
      type: post-file
      path: <CAMERA_FILE>
      buffer_length: <CAM_BUFFER>
      format:
        type: image-pack
        width: 672
        height: 376
        step: 1
  - streamer:
      tag: str_solution_file
      input_tags: [fmt_solution_file]
      type: file
      path: <OUTPUT_DIR>/solution.txt
      enable_time_tag: false

  formators:
  - formator:
      io: output
      tag: fmt_solution_file
      type: nmea
      use_esa: true
      use_esd: true
      talker_id: GP

  replay:
    enable: true
    speed: 1.0
    start_offset: 0.0

estimate:
- estimator:
    tag: est_gnss_imu_camera_rrr
    type: rtk_imu_camera_rrr_va
    input_tags: [str_gnss_rov_file, str_gnss_ref_file, str_gnss_eph_file, str_dcb_file, str_imu_file, str_camera_file]
    str_gnss_rov_file_roles: [rover]
    str_gnss_ref_file_roles: [reference]
    str_gnss_eph_file_roles: [ephemeris]
    str_dcb_file_roles: [code_bias]
    str_imu_file_roles: [major]
    str_camera_file_roles: [mono]
    output_tags: [fmt_solution_file]
    # Post-file template @ f2b8579: IMU-aligned ~10 Hz. Paper Table IV 1 Hz is ROS live;
    # author eval interpolates GT to solution timestamps (README §4).
    output_align_tag: str_imu_file
    output_downsample_rate: 40
    compute_covariance: false
    # ros_urbannav.yaml RRR block @ f2b8579 (estimate); post-file stream uses replay+align separately.
    enable_input_align: false
    input_align_latency: 0.2
    enable_backend_data_sparsify: true
    pending_num_threshold: 5
    rtk_imu_camera_rrr_options:
      max_keyframes: 20
      min_yaw_std_init_visual: 0.5
      use_vision_aided_ambiguity_resolution: true
      # Fast exact-in-window marginal covariance (default VA path): the SAME statistically
      # consistent quantity as the exact ceres path (Q_aa marginalizing every non-ambiguity
      # active state incl. the marginalization prior), but via structure-exploiting sparse
      # Schur elimination so it is real-time at every AR epoch. See research/VISION_AIDED_AR.md.
      ar_use_fast_marginal_covariance: true
      # Exact whole-problem ceres::Covariance path -- correctness reference only; superseded
      # by the fast path above (precedence: fast -> exact -> delta). Set fast=false to use it.
      ar_use_exact_joint_covariance: false
      # Legacy local shadow+delta experiment; disabled for the clean marginal path.
      ar_use_delta_information: false
    rtk_options:
      use_ambiguity_resolution: true
      # UrbanNav file-mode: HKKT base epochs are 30 s (default max_age=20 s drops pairs).
      max_age: 35.0
    gnss_estimator_base_options:
      # PREREG_ROBUST_FLOAT.md single-variable intervention: Tukey biweight
      # (c=4.685, literature-standard 95% efficiency) replaces HuberLoss(1.0)
      # on pseudorange/phaserange/doppler residuals.
      use_bounded_influence_gnss_loss: true
      min_num_satellite_redundancy: 2
      use_outlier_rejection: true
      max_pesudorange_error: 30.0
      max_phaserange_error: 0.1
      max_doppler_error: 5.0
      gnss_common:
        min_elevation: 7.0
        min_SNR: [30.0, 25.0]
      gnss_error_parameter:
        code_to_phase_ratio: 1000.0
        doppler_error_factor: 0.2
        relative_velocity: [10.0, 10.0, 1.0]
        relative_frequency: 0.01
    visual_estimator_base_options:
      feature_error_std: 5.0
      stable_feature_error_std: 1.0
      landmark_outlier_rejection_threshold: 20.0
      camera_extrinsics_initial_std: [0.1, 0.1, 0.1, 5.0, 5.0, 5.0]
    imu_estimator_base_options:
      imu_parameters:
        sigma_bg: 1.0e-3
        sigma_ba: 1.0e-2
        sigma_g_c: 1.027e-02
        sigma_a_c: 1.120e-02
        sigma_gw_c: 9.136e-05
        sigma_aw_c: 1.175e-04
      body_to_imu_rotation: [0.0, 0.0, 0.0]
      body_to_imu_rotation_std: 5.0
      car_motion: true
      car_motion_min_velocity: 3.0
      car_motion_max_anguler_velocity: 5.0
      zupt_max_acc_std: 0.45
      zupt_max_gyro_std: 0.05
      zupt_max_gyro_median: 0.01
      zupt_sigma_zero_velocity: 0.01
    estimator_base_options:
      max_iteration: 8
      num_threads: 1
      max_solver_time: 1.0e9
      verbose_output: false
      solver_type: dense_schur
      trust_region_strategy_type: dogleg
    ambiguity_resolution_options:
      system_exclude: [R]
      min_percentage_fixation_uwl: 1.0
      min_percentage_fixation_wl: 0.9
      min_percentage_fixation_nl: 0.9
      ratio: 2.0
      # Decision-layer upgrade (research/VISION_AIDED_AR.md, 2026-07-18): vision/IMU veto
      # on fixation (zero-threshold, mirrors upstream range-cost rule) + integer-
      # bootstrapping success-rate gate at the pre-registered 0.1% failure budget.
      use_joint_cost_validation: true
      min_bootstrap_success_rate: 0.0  # gate OFF: dose is the sole P_s mechanism (addendum 20:20)
      # PREREG_SOFT_WEIGHT.md single-variable intervention: constraint information
      # = 1/[(1-P_s)*1 + P_s*1e-6] cycle^-2 of the accepted subset (dose, not switch).
      use_success_rate_fix_information: true
    gnss_imu_initializer_options:
      max_iteration: 30
      num_threads: 1
      max_solver_time: 1.0e9
      gnss_extrinsics: [0.0, -0.43, -0.16]
      gnss_extrinsics_initial_std: [0.0, 0.0, 0.0]
      time_window_length_slow_motion: 0.1
      time_window_length_dynamic_motion: 3.0
      min_acceleration: 0.5
    feature_handler_options:
      max_features_per_frame: 100
      max_n_kfs: 100000
      min_disparity_init_landmark: 10.0
      min_translation_init_landmark: 0.5
      kfselect_min_numkfs: 30
      kfselect_min_disparity: 10.0
      kfselect_min_dist_metric: 0.5
      kfselect_min_angle: 5.0
      kfselect_min_dt: 0.5
      detector:
        cell_size: 40
      camera_parameters:
        label: urbannav-zed2-left
        cameras:
        - camera:
            label: cam0
            image_width: 672
            image_height: 376
            type: pinhole
            intrinsics:
              cols: 1
              rows: 4
              data: [264.9425, 264.79, 334.3975, 183.162]
            distortion:
              type: radial-tangential
              parameters:
                cols: 1
                rows: 4
                data: [-0.0442856, 0.0133574, 0.0, 0.0]
          T_B_C:
            cols: 4
            rows: 4
            data: [0.9988523440263594, 0.0013591158885982, 0.0478763786960621, -0.0849942494565455,
                  -0.0478641883492691, -0.0079091258538426, 0.9988225393942077, 0.126,
                  0.001736175887714, -0.9999677987476544, -0.0078349959194297, 0.076,
                  0.0, 0.0, 0.0, 1.0]

logging:
  enable: false
